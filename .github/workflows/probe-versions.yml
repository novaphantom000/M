---
name: Probe - Material3 versions

on:
  workflow_dispatch:
  push:
    branches:
      - m3-expressive-overhaul
    paths:
      - '.github/workflows/probe-versions.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: List JetBrains material3 versions
        run: |
          curl -fsS https://repo1.maven.org/maven2/org/jetbrains/compose/material3/material3/maven-metadata.xml | grep -E '<version>|<latest>|<release>' | tail -25
      - name: List JetBrains compose gradle plugin versions
        run: |
          curl -fsS https://repo1.maven.org/maven2/org/jetbrains/compose/compose-gradle-plugin/maven-metadata.xml | grep -E '<version>|<latest>|<release>' | tail -12
